    <body>

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              
                  new TomSelect("#select-node",{
                      create: false,
                      sortField: {
                          field: "text",
                          direction: "asc"
                      }
                  });
              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"font": {"color": "white"}, "group": "EU_influence_on_political_events_in_Ukraine", "id": "a3", "label": "a3", "shape": "star", "size": 25, "title": "\u003cb\u003eTopic:\u003c/b\u003e EU_influence_on_political_events_in_Ukraine\u003cbr\u003e\u003cb\u003eCluster:\u003c/b\u003e EU_influence_on_political_events_in_Ukraine_C1\u003cbr\u003e\u003cbr\u003efor that course can only lead to escalation in some form."}, {"font": {"color": "white"}, "group": "EU_influence_on_political_events_in_Ukraine", "id": "a2", "label": "a2", "shape": "dot", "size": 10, "title": "\u003cb\u003eTopic:\u003c/b\u003e EU_influence_on_political_events_in_Ukraine\u003cbr\u003e\u003cb\u003eCluster:\u003c/b\u003e EU_influence_on_political_events_in_Ukraine_C1\u003cbr\u003e\u003cbr\u003eThe developments in that conflict should not be left to former Cold War opponents alone,"}, {"font": {"color": "white"}, "group": "MISSING_TOPIC", "id": "a4", "label": "a4", "shape": "star", "size": 25, "title": "\u003cb\u003eTopic:\u003c/b\u003e MISSING_TOPIC\u003cbr\u003e\u003cb\u003eCluster:\u003c/b\u003e MISSING_TOPIC_C1\u003cbr\u003e\u003cbr\u003eBesides, Jochen was given a parachute jump the other day as a gift,"}, {"font": {"color": "white"}, "group": "MISSING_TOPIC", "id": "a1", "label": "a1", "shape": "dot", "size": 10, "title": "\u003cb\u003eTopic:\u003c/b\u003e MISSING_TOPIC\u003cbr\u003e\u003cb\u003eCluster:\u003c/b\u003e MISSING_TOPIC_C1\u003cbr\u003e\u003cbr\u003eLarge events that stir national or even international attention attract many visitors,"}, {"font": {"color": "white"}, "group": "MISSING_TOPIC", "id": "a5", "label": "a5", "shape": "dot", "size": 10, "title": "\u003cb\u003eTopic:\u003c/b\u003e MISSING_TOPIC\u003cbr\u003e\u003cb\u003eCluster:\u003c/b\u003e MISSING_TOPIC_C1\u003cbr\u003e\u003cbr\u003eand it mustn\u0027t be that this wannabe-adventurer has one up on me."}, {"font": {"color": "white"}, "group": "cap_rent_increases", "id": "a8", "label": "a8", "shape": "star", "size": 25, "title": "\u003cb\u003eTopic:\u003c/b\u003e cap_rent_increases\u003cbr\u003e\u003cb\u003eCluster:\u003c/b\u003e cap_rent_increases_C2\u003cbr\u003e\u003cbr\u003eas they can plan for a maximum rent increase."}, {"font": {"color": "white"}, "group": "cap_rent_increases", "id": "a6", "label": "a6", "shape": "dot", "size": 10, "title": "\u003cb\u003eTopic:\u003c/b\u003e cap_rent_increases\u003cbr\u003e\u003cb\u003eCluster:\u003c/b\u003e cap_rent_increases_C2\u003cbr\u003e\u003cbr\u003eas they can adjust their expenses through the increase,"}, {"font": {"color": "white"}, "group": "cap_rent_increases", "id": "a7", "label": "a7", "shape": "dot", "size": 10, "title": "\u003cb\u003eTopic:\u003c/b\u003e cap_rent_increases\u003cbr\u003e\u003cb\u003eCluster:\u003c/b\u003e cap_rent_increases_C2\u003cbr\u003e\u003cbr\u003eand also the tenants,"}, {"font": {"color": "white"}, "group": "cap_rent_increases", "id": "a10", "label": "a10", "shape": "star", "size": 25, "title": "\u003cb\u003eTopic:\u003c/b\u003e cap_rent_increases\u003cbr\u003e\u003cb\u003eCluster:\u003c/b\u003e cap_rent_increases_C1\u003cbr\u003e\u003cbr\u003eas they have more pull in the end anyway."}, {"font": {"color": "white"}, "group": "cap_rent_increases", "id": "a9", "label": "a9", "shape": "dot", "size": 10, "title": "\u003cb\u003eTopic:\u003c/b\u003e cap_rent_increases\u003cbr\u003e\u003cb\u003eCluster:\u003c/b\u003e cap_rent_increases_C1\u003cbr\u003e\u003cbr\u003eThat the landlords are then slightly restricted in the administration of their property is not a problem,"}]);
                  edges = new vis.DataSet([{"color": "#555555", "from": "a3", "to": "a2"}, {"color": "#555555", "from": "a4", "to": "a1"}, {"color": "#555555", "from": "a4", "to": "a5"}, {"color": "#555555", "from": "a4", "to": "a3"}, {"color": "#555555", "from": "a4", "to": "a2"}, {"color": "#555555", "from": "a10", "to": "a9"}, {"color": "#555555", "from": "a8", "to": "a6"}, {"color": "#555555", "from": "a8", "to": "a7"}, {"color": "#555555", "from": "a8", "to": "a5"}, {"color": "#555555", "from": "a4", "to": "a6"}, {"color": "#555555", "from": "a6", "to": "a5"}, {"color": "#555555", "from": "a1", "to": "a2"}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "barnesHut": {
            "avoidOverlap": 0,
            "centralGravity": 0.3,
            "damping": 0.09,
            "gravitationalConstant": -2000,
            "springConstant": 0.001,
            "springLength": 100
        },
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  
                    network.on("selectNode", neighbourhoodHighlight);
                  

                  


                  

                  return network;

              }
              drawGraph();
